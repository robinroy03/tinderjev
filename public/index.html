<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tinderjev</title>
<style>
  :root {
    --bg: #ffffff; --side: #f5f5f7; --line: #e6e6ea; --text: #1d1d1f; --muted: #6e6e73;
    --blue: #0b84ff; --bubble-me: #1f8dff; --bubble-them: #e9e9eb; --green: #34c759; --red: #ff3b30; --chip: #2f6fed;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body { display: grid; grid-template-columns: 24px 1fr 1fr; height: 100vh; overflow: hidden; }
  @media (max-width: 900px) { body { grid-template-columns: 24px 1fr; grid-template-rows: 70vh auto; height: auto; overflow: auto; } .right { grid-column: 1 / -1; } }

  /* eval bar: Jev's goal probability */
  .evalbar { position: relative; background: #e9e9ec; overflow: hidden; }
  .evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--blue); transition: height 1s cubic-bezier(.2,.8,.2,1); }
  .evalbar .val { position: absolute; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 700; color: #fff; transform: translateY(100%); padding-top: 3px; }

  /* messages */
  .chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; background: var(--bg); }
  .chead { height: 66px; display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.9); backdrop-filter: blur(14px); }
  .chead .back { color: var(--blue); font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .chead .back b { font-size: 11px; background: var(--blue); color: #fff; border-radius: 10px; padding: 1px 6px; font-weight: 600; }
  .chead .who { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  .chead .av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(180deg,#c8c8cd,#9a9aa2); display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 600; }
  .chead .nm { font-size: 12px; }
  .chead .nm::after { content: " ›"; color: var(--muted); }
  .chead .vid { justify-self: end; color: var(--blue); display: flex; }
  .thread { flex: 1; overflow-y: auto; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 70%; padding: 7px 12px; border-radius: 17px; font-size: 13.5px; line-height: 1.32; position: relative; animation: pop .25s cubic-bezier(.2,.9,.3,1.2); white-space: pre-wrap; word-wrap: break-word; }
  .them .bubble { background: var(--bubble-them); color: #000; }
  .me .bubble { background: var(--bubble-me); color: #fff; }
  .me .bubble::after { content: ""; position: absolute; right: -5px; bottom: 0; width: 12px; height: 14px; background: var(--bubble-me); clip-path: polygon(0 0, 100% 100%, 0 100%); border-bottom-left-radius: 12px 10px; }
  .them .bubble::after { content: ""; position: absolute; left: -5px; bottom: 0; width: 12px; height: 14px; background: var(--bubble-them); clip-path: polygon(100% 0, 100% 100%, 0 100%); border-bottom-right-radius: 12px 10px; }
  .delivered { font-size: 10.5px; color: var(--muted); text-align: right; margin: -6px 4px 0; }
  @keyframes pop { from { transform: scale(.9) translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
  .composer { display: flex; align-items: center; gap: 10px; padding: 10px 16px 14px; }
  .plus { width: 30px; height: 30px; border-radius: 50%; background: #ededf0; color: #8a8a90; display: grid; place-items: center; font-size: 20px; flex: none; }
  .field { flex: 1; display: flex; align-items: center; border: 1px solid #d9d9de; border-radius: 18px; padding: 4px 8px 4px 12px; background: #fff; }
  .field textarea { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 13.5px; resize: none; line-height: 1.3; max-height: 100px; padding: 3px 0; }
  .field textarea::placeholder { color: #a5a5ab; }
  .field .sendbtn { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; background: transparent; color: #c7c7cc; cursor: default; padding: 0; transition: color .15s; }
  .field.has .sendbtn { color: var(--blue); cursor: pointer; }

  /* right panel */
  .right { background: var(--side); overflow-y: auto; padding: 14px 18px 24px; position: relative; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; position: relative; z-index: 1; }
  .tools button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 76px; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
  .tools button svg { width: 26px; height: 26px; }
  .tools button:hover { background: #f6f9ff; border-color: #c9d6f5; }
  .tools button.danger:hover { background: #fff5f4; border-color: #f5c6c2; color: var(--red); }
  .brand { display: flex; flex-direction: column; align-items: center; margin: 8px 0 18px; }
  .brand .logo { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .brand h1 { margin: 10px 0 2px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .brand .v { font-size: 11px; color: var(--muted); }
  section { margin-bottom: 14px; }
  section h2 { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 8px; }
  section h2 svg { width: 15px; height: 15px; }
  section h2 .st { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #c7c7cc; } .dot.busy { background: var(--blue); animation: pulse 1s infinite; } .dot.err { background: var(--red); }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.7); opacity: .5 } }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  input.goal { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 13px; outline: 0; color: var(--text); }
  input.goal:focus { border-color: var(--blue); }
  .results .r { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; animation: pop .3s; }
  .results .r:last-child { border-bottom: 0; }
  .results .r:hover { background: #f6f9ff; }
  .results .chip { background: var(--chip); color: #fff; font-weight: 700; font-size: 12.5px; border-radius: 5px; padding: 3px 0; text-align: center; font-variant-numeric: tabular-nums; }
  .results .r.pending { cursor: default; } .results .r.pending .chip { background: #c9d6f5; }
  .results .r .meta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .results .r .go { font-size: 11px; font-weight: 600; color: var(--blue); opacity: 0; }
  .results .r:hover .go { opacity: 1; }
  .empty { padding: 12px; font-size: 12.5px; color: var(--muted); }

  /* message impact chart */
  .chart { padding: 12px 12px 8px; position: relative; }
  .chart svg { width: 100%; height: 200px; display: block; }
  .chart .grid { stroke: #eceef1; stroke-width: 1; }
  .chart .axis { fill: var(--muted); font-size: 10.5px; }
  .chart .line { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: var(--blue); opacity: .08; }
  .chart .pt { stroke: #fff; stroke-width: 2; } .chart .pt.me { fill: var(--blue); } .chart .pt.them { fill: #b8b8bf; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .hit:hover ~ .pt[data-i] { }
  .legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: -1px; }
  .legend .sw.me { background: var(--blue); } .legend .sw.them { background: #b8b8bf; }
  .tip { position: absolute; pointer-events: none; background: #1d1d1f; color: #fff; font-size: 11.5px; border-radius: 6px; padding: 7px 9px; max-width: 240px; display: none; z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .tip b { font-weight: 600; } .tip .d { color: #b8b8bf; margin-top: 3px; }
</style>
</head>
<body>

<div class="evalbar" title="Jev: probability the goal is achieved"><div class="fill" id="evalFill" style="height:50%"><div class="val" id="evalVal">0.5</div></div></div>

<div class="chat">
  <div class="chead">
    <div class="back">‹ <b>1</b></div>
    <div class="who" onclick="renameContact()" title="Rename"><div class="av" id="avatar">S</div><div class="nm" id="hname">Sara</div></div>
    <div class="vid"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="12" height="10" rx="2.5"/><path d="M15 11l5-3v8l-5-3z"/></svg></div>
  </div>
  <div class="thread" id="thread"></div>
  <div class="composer">
    <div class="plus">+</div>
    <div class="field" id="field">
      <textarea id="input" rows="1" placeholder="iMessage"></textarea>
      <button class="sendbtn" onclick="sendFromComposer()" aria-label="Send"><svg viewBox="0 0 512 512" width="20" height="20" fill="currentColor"><path d="M476.59 227.05l-.16-.07L49.35 49.84A23.56 23.56 0 0027.14 52 24.65 24.65 0 0016 72.59v113.29a24 24 0 0019.52 23.57l232.93 43.07a4 4 0 010 7.86L35.53 303.45A24 24 0 0016 327v113.31A23.57 23.57 0 0026.59 460a23.94 23.94 0 0013.22 4 24.55 24.55 0 009.52-1.93L476.4 285.94l.19-.09a32 32 0 000-58.8z"/></svg></button>
    </div>
  </div>
</div>

<div class="right">

  <div class="brand">
    <img class="logo" src="/logo.png" alt="" />
    <h1>tinderjev</h1>
  </div>

  <section>
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Conversation goal</h2>
    <input class="goal" id="goal" placeholder="Enter your goal..." />
  </section>

  <section>
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Top replies<span class="st"><span class="dot" id="dot"></span><span id="statusText">idle</span></span></h2>
    <div class="box results" id="results"><div class="empty">Waiting for a message…</div></div>
  </section>

  <section>
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16h16"/><path d="M8 16V9M12 16V5M16 16v-6"/></svg>Goal odds over time<span class="st legend"><i class="sw me"></i>you <i class="sw them"></i><span id="legendName">Sara</span></span></h2>
    <div class="box chart" id="chartBox"><div class="empty" style="padding:0" id="chartEmpty">Nothing scored yet.</div><svg id="chart"></svg><div class="tip" id="tip"></div></div>
  </section>

  <div class="tools">
    <button onclick="api('/api/undo')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo last message</button>
    <button class="danger" onclick="confirm('Clear the conversation?') && api('/api/reset')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>Reset conversation</button>
  </div>
</div>

<script>
  let S = null, lastCount = -1, LEVELS = [];
  const $ = (id) => document.getElementById(id);
  fetch('/api/rubric').then(r => r.json()).then(d => { LEVELS = d.levels || []; render(); });

  async function api(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    return r.json();
  }
  function sendFromComposer() {
    const el = $('input'); const text = el.value.trim(); if (!text) return;
    el.value = ''; el.style.height = 'auto'; $('field').classList.remove('has');
    api('/api/message', { from: 'me', text });
  }
  const input = $('input');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFromComposer(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(100, input.scrollHeight) + 'px'; $('field').classList.toggle('has', input.value.trim().length > 0); });

  const goalEl = $('goal');
  goalEl.addEventListener('blur', () => { if (S && goalEl.value !== S.goal) api('/api/goal', { goal: goalEl.value }); });
  goalEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') goalEl.blur(); });
  function renameContact() { const n = prompt('Their name', S ? S.contact.name : ''); if (n && n.trim()) api('/api/goal', { contact: n.trim() }); }

  function pick(id) {
    const s = S.suggestions.find(x => x.id === id); if (!s || s.pending) return;
    input.value = s.text; input.dispatchEvent(new Event('input')); input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const pct = (x) => Math.round(x * 100) + '%';

  function render() {
    if (!S) return;
    $('hname').textContent = S.contact.name; $('avatar').textContent = S.contact.initials;
    if (document.activeElement !== goalEl) goalEl.value = S.goal;

    const t = $('thread');
    t.innerHTML = S.messages.map((m, i) =>
      `<div class="row ${m.from}"><div class="bubble">${esc(m.text)}</div></div>` +
      (m.from === 'me' && i === S.messages.length - 1 ? '<div class="delivered">Delivered</div>' : '')
    ).join('');
    if (S.messages.length !== lastCount) { t.scrollTop = t.scrollHeight; lastCount = S.messages.length; }

    const p = Math.max(0.02, Math.min(0.98, S.goalProb));
    $('evalFill').style.height = (p * 100) + '%';
    $('evalVal').textContent = p.toFixed(2).replace(/0$/, '');

    const busy = ['scoring', 'drafting', 'ranking'].includes(S.status.phase);
    $('dot').className = 'dot ' + (busy ? 'busy' : S.status.phase === 'error' ? 'err' : '');
    $('statusText').textContent = S.status.detail || S.status.phase;
    const ourTurn = S.messages.length && S.messages[S.messages.length - 1].from === 'them';

    const rs = $('results');
    if (S.suggestions.length) {
      rs.innerHTML = S.suggestions.map(s => s.pending
        ? `<div class="r pending"><div class="chip">…</div><div>${esc(s.text)}<div class="meta">jev is evaluating…</div></div><div></div></div>`
        : `<div class="r" onclick="pick('${s.id}')"><div class="chip">${s.composite.toFixed(2)}</div><div>${esc(s.text)}<div class="meta">effect ${s.effectScore.toFixed(2)}/4 · warm reply ${pct(s.positiveReply)} · cringe ${pct(s.cringe)} · confidence ${pct(s.confidence)}</div></div><div class="go">use</div></div>`
      ).join('');
    } else if (S.status.phase === 'drafting') {
      rs.innerHTML = [1,2,3].map(() => `<div class="r pending"><div class="chip">…</div><div style="color:var(--muted)">astra is drafting…</div><div></div></div>`).join('');
    } else if (!S.goal) rs.innerHTML = '<div class="empty">Set a goal to start.</div>';
    else if (!S.messages.length) rs.innerHTML = '<div class="empty">Waiting for a message…</div>';
    else if (!ourTurn) rs.innerHTML = `<div class="empty">Waiting for ${esc(S.contact.name)} to reply.</div>`;
    else rs.innerHTML = '<div class="empty">Scoring…</div>';

    $('legendName').textContent = S.contact.name;
    drawChart();
  }

  const SHORT = ['Disaster', 'Hurts', 'Neutral', 'Helps', 'Big win'];
  function drawChart() {
    // one bar per message: Jev's probability that the goal is achieved, judged on the whole conversation up to that message
    const scored = S.messages.map((m, i) => ({ ...m, n: i + 1 })).filter(m => typeof m.goalProbAfter === 'number');
    const svg = $('chart'), empty = $('chartEmpty');
    if (!scored.length) { svg.innerHTML = ''; svg.style.display = 'none'; empty.style.display = 'block'; return; }
    svg.style.display = 'block'; empty.style.display = 'none';
    const W = svg.clientWidth || 600, H = svg.clientHeight || 190, L = 40, R = 10, T = 10, B = 24;
    const pw = W - L - R, ph = H - T - B;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const y = (v) => T + ph - v * ph;
    const n = Math.max(scored.length, 8), slot = pw / n;
    const px = (i) => L + i * slot + slot / 2;
    let out = '';
    for (let k = 0; k <= 4; k++) out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(k / 4)}" y2="${y(k / 4)}"/><text class="axis" x="${L - 8}" y="${y(k / 4) + 3.5}" text-anchor="end">${k * 25}%</text>`;
    const pts = scored.map((m, i) => [px(i), y(m.goalProbAfter)]);
    const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (pts.length > 1) out += `<path class="area" d="${path} L${pts[pts.length-1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z"/>`;
    out += `<path class="line" d="${path}"/>`;
    scored.forEach((m, i) => {
      out += `<rect class="hit" x="${L + i * slot}" y="${T}" width="${slot}" height="${ph}" data-i="${i}"/>` +
             `<circle class="pt ${m.from}" cx="${pts[i][0]}" cy="${pts[i][1]}" r="4.5"/>` +
             `<text class="axis" x="${pts[i][0]}" y="${H - 8}" text-anchor="middle">${m.n}</text>`;
    });
    svg.innerHTML = out;
    const tip = $('tip');
    svg.querySelectorAll('.hit').forEach(h => {
      h.addEventListener('mousemove', (e) => {
        const m = scored[+h.dataset.i], ef = m.effect;
        const who = m.from === 'me' ? 'you' : S.contact.name;
        tip.innerHTML = `<b>${esc(who)}:</b> ${esc(m.text)}<div class="d">goal odds after this: ${pct(m.goalProbAfter)}</div>` +
          (ef ? `<div class="d">this message: ${SHORT[Math.round(ef.score)]} (${ef.score.toFixed(2)}/4, confidence ${pct(ef.confidence)})</div>` : '');
        const r = $('chartBox').getBoundingClientRect();
        tip.style.display = 'block';
        tip.style.left = Math.min(e.clientX - r.left + 12, r.width - 250) + 'px';
        tip.style.top = (e.clientY - r.top - 10) + 'px';
      });
      h.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
    });
  }
  window.addEventListener('resize', () => S && drawChart());

  function connect() {
    const es = new EventSource('/api/events');
    es.onmessage = (e) => { S = JSON.parse(e.data); render(); };
    es.onerror = () => { es.close(); setTimeout(connect, 1500); };
  }
  connect();
</script>
</body>
</html>
